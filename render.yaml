# Render Blueprint: one-click hosting on https://render.com
# Dashboard → New → Blueprint → pick this repo. Render creates the website, a Postgres
# database, and a Redis-compatible store, and redeploys on every push to main.
# You'll be asked for two AI keys — leave both blank: visitors bring their own key
# (Claude, ChatGPT, or Gemini) on the site's "AI key" page. See docs/DEPLOY.md.
# Plans/pricing change over time — review them on the Blueprint screen before applying.

services:
  - type: web
    name: coopradar
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coopradar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: coopradar-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ENABLED
        value: "true"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: SEED_ON_START
        value: "true"

  - type: keyvalue
    name: coopradar-redis
    plan: free
    ipAllowList: []   # reachable only from your Render services

databases:
  - name: coopradar-db
    plan: free
    postgresMajorVersion: "16"
