# Render Blueprint: free hosting on https://render.com (no Docker needed).
# Dashboard → New → Blueprint → pick this repo. Render creates the website and redeploys on
# every push to main. Full walkthrough: README.md "Host it for free", or docs/DEPLOY.md.
#
# The database lives on Neon's free plan (https://neon.tech), which doesn't expire. Render's
# own free database is deleted after 30 days, so it isn't used here.
# When Render asks, paste:
#   DATABASE_URL       your Neon connection string (Neon dashboard → Connect; the direct one,
#                      not "pooled"; postgresql://...?sslmode=require is fine as it is)
#   ANTHROPIC_API_KEY  leave blank: visitors bring their own AI key on the site's "AI key" page
#   OPENAI_API_KEY     leave blank (only needed for smart search)
# On first start the site imports real jobs from ~120 employers' career boards (a few minutes),
# then refreshes them every 6 hours while it's awake. Plans and prices change over time:
# review them on the Blueprint screen before applying.

services:
  - type: web
    name: coopradar
    runtime: python
    plan: free
    # Install the API, then build the React site (Render's Python runtime includes Node.js)
    buildCommand: pip install -e backend && npm ci --prefix frontend && npm run build --prefix frontend
    # Migrate the database, load the career boards, and serve the site + API on $PORT
    startCommand: python start.py --hosted
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ENABLED
        value: "true"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: INGEST_INTERVAL_HOURS
        value: "6"
