# Render Blueprint: one-click hosting on https://render.com (no Docker needed).
# Dashboard → New → Blueprint → pick this repo. Render creates the website and a Postgres
# database, and redeploys on every push to main.
# You'll be asked for two AI keys — leave both blank: visitors bring their own key
# (Claude, ChatGPT, or Gemini) on the site's "AI key" page. See docs/DEPLOY.md.
# On first start the site imports real Canadian jobs from ~27 employers' career boards
# (takes a minute or two), then refreshes them every 6 hours.
# Plans/pricing change over time — review them on the Blueprint screen before applying.

services:
  - type: web
    name: coopradar
    runtime: python
    plan: free
    # Install the API, then build the React site (Render's Python runtime includes Node.js)
    buildCommand: pip install -e backend && npm ci --prefix frontend && npm run build --prefix frontend
    # Migrate the database, load the career boards, and serve the site + API on $PORT
    startCommand: python start.py --hosted
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: coopradar-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ENABLED
        value: "true"
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: INGEST_INTERVAL_HOURS
        value: "6"

databases:
  - name: coopradar-db
    plan: free
    postgresMajorVersion: "16"
