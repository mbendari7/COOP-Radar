<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Co-op and internship jobs from real employers in Canada, matched to your program, graduation year and resume. Free, no sign-up." />
    <meta name="theme-color" content="#c8281e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the page. Until they arrive the text uses the system font.
         Only the widths and weights the site uses, so the files stay small -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..800&family=Inter:wght@400..800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..800&family=Inter:wght@400..800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..800&family=Inter:wght@400..800&display=swap" /></noscript>
    <!-- Start talking to the API while the code downloads -->
    <link rel="preload" as="fetch" href="/api/postings/snapshot" crossorigin="use-credentials" />
    <title>CoopRadar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
