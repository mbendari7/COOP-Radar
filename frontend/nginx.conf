# Production static server for the built SPA (used by the Dockerfile `prod` stage).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: forward /api to the backend so cookies stay first-party.
    # "api" is the backend's hostname on the Docker network — change it for your deploy.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;   # stream Server-Sent Events (resume Q&A) immediately
    }

    # Hashed assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths serve the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
