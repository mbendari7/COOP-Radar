[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coopradar-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",         # async PostgreSQL driver for SQLAlchemy
    "alembic>=1.13",
    "httpx>=0.27",           # JSON API ingestion adapter + test client
    "greenlet>=3.0",         # required by SQLAlchemy async
    "argon2-cffi>=23.1",     # argon2id password hashing (OWASP-recommended)
    "redis>=5.0",            # sessions/rate limits (redis.asyncio) + RQ queue
    "pandas>=2.2",           # CSV upload parsing + tracker CSV export
    "rq>=1.16",              # background job queue (ingest + embedding jobs)
    "openai>=1.30",          # embeddings (smart search) + ChatGPT for visitors' own keys
    "pgvector>=0.3",         # pgvector SQLAlchemy integration
    "python-multipart>=0.0.9", # FastAPI file upload support
    "feedparser>=6.0",       # RSS/Atom feed parsing
    "anthropic>=1.0",        # Claude: match ranking, field extraction, resume Q&A
    "google-genai>=1.0",     # Gemini, for visitors who bring a Google AI key
    "pypdf>=4.0",            # PDF text extraction for resume upload
    "python-docx>=1.1",      # DOCX text extraction for resume upload
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",           # httpx request mocking for ingest tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "seed*"]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]   # FastAPI Depends() calls are fine as default args

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat alembic as first-party
known-third-party = ["alembic"]
known-first-party = ["app", "seed", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]   # long DDL strings
"seed/*.py" = ["E501"]               # long sample-data rows
"tests/**/*.py" = ["E501"]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]      # generated migration files don't need strict typing

[[tool.mypy.overrides]]
# Third-party packages without type hints
module = ["pgvector.*", "feedparser.*", "docx.*", "rq.*", "pandas.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"       # all async tests run automatically
# One event loop for the whole session so the session-scoped DB engine fixture works
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "perf: performance benchmarks (run separately with -m perf)",
]
