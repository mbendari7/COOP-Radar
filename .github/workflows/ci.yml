name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · migrations · pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 16 with pgvector (GitHub runs this database for the tests)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coopradar
          POSTGRES_PASSWORD: coopradar
          POSTGRES_DB: coopradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://coopradar:coopradar@localhost:5432/coopradar_test
      # Tests mock the session store, background jobs, Claude, and OpenAI — no keys needed.
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict)
        run: mypy app

      - name: Migrations apply, roll back, and re-apply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations (no autogenerate drift)
        run: alembic check

      - name: OpenAPI schema is committed and current
        run: |
          python -m scripts.export_openapi
          git diff --exit-code -- ../frontend/openapi.json

      - name: Run tests
        run: pytest -q --tb=short -m "not perf"

      - name: Performance budget (p95 < 300 ms on 10k postings)
        run: pytest -q --tb=short -m perf -s

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Generated API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/types.gen.ts

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  # ── Whole website ────────────────────────────────────────────────────────
  # Runs the site exactly the way the host does (`python start.py --hosted`):
  # migrations, seed data, built React site, and API all served on one port.
  website:
    name: Website (build · start · smoke test · Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coopradar
          POSTGRES_PASSWORD: coopradar
          POSTGRES_DB: coopradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coopradar:coopradar@localhost:5432/coopradar
      PORT: "8080"
      # Plain http in CI; on a real host cookies stay Secure
      COOKIE_SECURE: "false"
      # Don't call real career boards from CI; use the made-up sample postings instead
      SEED_JOB_BOARDS: "false"
      SEED_SAMPLE_POSTINGS: "true"
      BACKGROUND_JOBS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (same command as render.yaml)
        run: pip install -e backend && npm ci --prefix frontend && npm run build --prefix frontend

      - name: Start the site
        run: |
          python start.py --hosted > site.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 2
          done
          cat site.log
          exit 1

      - name: Smoke test website, API, demo and guest accounts
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/resume | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/postings | grep -q '"total"'
          curl -fsS "http://localhost:8080/api/postings?students_only=true" | grep -q '"total"'
          curl -fsS -X POST http://localhost:8080/api/auth/demo | grep -q '"is_demo":true'
          curl -fsS -c jar -X POST http://localhost:8080/api/auth/guest | grep -q '"is_demo":true'
          # The guest session lives in Postgres (no Redis) and works on the next request
          curl -fsS -b jar http://localhost:8080/api/me | grep -q '"is_demo":true'

      - name: End-to-end tests (Playwright, real browser)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: cat site.log
