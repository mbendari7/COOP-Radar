name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · migrations · pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose: ships pgvector and fuzzystrmatch
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coopradar
          POSTGRES_PASSWORD: coopradar
          POSTGRES_DB: coopradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://coopradar:coopradar@localhost:5432/coopradar_test
      # Tests mock Redis, the RQ queue, Claude, and OpenAI — no keys or services needed.
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict)
        run: mypy app

      - name: Migrations apply, roll back, and re-apply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations (no autogenerate drift)
        run: alembic check

      - name: Run tests
        run: pytest -q --tb=short -m "not perf"

      - name: Performance budget (p95 < 300 ms on 10k postings)
        run: pytest -q --tb=short -m perf -s

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build
