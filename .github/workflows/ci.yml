name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (ruff · mypy · migrations · pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose: ships pgvector and fuzzystrmatch
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coopradar
          POSTGRES_PASSWORD: coopradar
          POSTGRES_DB: coopradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+asyncpg://coopradar:coopradar@localhost:5432/coopradar_test
      # Tests mock Redis, the RQ queue, Claude, and OpenAI — no keys or services needed.
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict)
        run: mypy app

      - name: Migrations apply, roll back, and re-apply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models match migrations (no autogenerate drift)
        run: alembic check

      - name: Run tests
        run: pytest -q --tb=short -m "not perf"

      - name: Performance budget (p95 < 300 ms on 10k postings)
        run: pytest -q --tb=short -m perf -s

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Run tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build

  # ── Production image ─────────────────────────────────────────────────────
  # Builds the all-in-one website image (root Dockerfile) and checks it starts:
  # migrations, seed data, built site, and API all served on one port.
  docker:
    name: Production image (build · boot · smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate the compose file
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build and start the production stack
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for the site to be healthy
        env:
          POSTGRES_PASSWORD: ci-password
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 3
          done
          exit 1

      - name: Smoke test website, API, demo and guest accounts
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/resume | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/postings | grep -q '"total"'
          curl -fsS "http://localhost:8080/api/postings?students_only=true" | grep -q '"total"'
          curl -fsS -X POST http://localhost:8080/api/auth/demo | grep -q '"is_demo":true'
          curl -fsS -X POST http://localhost:8080/api/auth/guest | grep -q '"is_demo":true'

      - name: Show logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose -f docker-compose.prod.yml logs
