# Keeps the hosted site awake so it opens quickly, and its jobs fresh.
#
# A free Render web service sleeps after ~15 minutes without visitors. Waking it takes 30 to 60
# seconds, which is the slow first load people notice, and the job importer only runs while it
# is awake. This pings the site every 10 minutes from 7 am to 1 am Eastern time (11:00 to 04:59
# UTC), so it stays up all day and imports a few boards at a time, the ones that waited longest
# first. It sleeps overnight, which keeps it inside Render's 750 free hours a month and leaves
# Neon's free database time for the importer.
#
# Turn it on: GitHub repo → Settings → Secrets and variables → Actions → Variables →
# New repository variable: SITE_URL = https://your-site.onrender.com (no trailing slash).
# Without SITE_URL it does nothing. Free for public repositories. For a private repository,
# use a free uptime checker like UptimeRobot or cron-job.org on SITE_URL/api/health instead
# (see README.md "Make it load fast"). GitHub can run scheduled jobs a few minutes late.

name: Keep the site awake

on:
  schedule:
    - cron: "*/10 0-4,11-23 * * *"
  workflow_dispatch:

jobs:
  wake:
    name: Ping the site
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    timeout-minutes: 5
    steps:
      - name: Ping (a sleeping site can take a minute to answer)
        run: |
          for i in $(seq 1 4); do
            if curl -fsS --max-time 90 "${{ vars.SITE_URL }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "The site didn't answer" && exit 1
