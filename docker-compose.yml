# CoopRadar local development stack.
#
#   docker compose up --build        # start everything (http://localhost:5173)
#
# Values come from .env (copy .env.example). The api container applies database
# migrations on startup, so a fresh clone needs no manual migration step.

# Settings shared by the API and the background worker
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coopradar}:${POSTGRES_PASSWORD:-coopradar}@db:5432/${POSTGRES_DB:-coopradar}
  REDIS_URL: redis://redis:6379/0
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
  FAST_MODEL: ${FAST_MODEL:-claude-haiku-5-5}
  EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}

services:
  # PostgreSQL 16 with pgvector (embeddings) and fuzzystrmatch (dedup) available.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coopradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coopradar}
      POSTGRES_DB: ${POSTGRES_DB:-coopradar}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coopradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: login sessions, rate-limit counters, and the RQ job queue.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI backend. Migrates the DB, then serves with --reload so code changes apply live.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: coopradar-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # RQ worker: runs ingestion + embedding jobs and the 6-hourly ingest scheduler.
  worker:
    image: coopradar-api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-6}
    volumes:
      - ./backend:/app
    command: python -m app.worker

  # Vite dev server with HMR. The browser calls /api on the same origin and Vite
  # proxies it to the api container, so session cookies stay first-party (no CORS).
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container node_modules isolated from host
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
