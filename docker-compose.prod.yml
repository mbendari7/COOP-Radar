# Production / self-hosting: the whole website on any machine with Docker.
#
#   cp .env.example .env            # set POSTGRES_PASSWORD (+ AI keys)
#   docker compose -f docker-compose.prod.yml up -d --build
#   → http://localhost:8080
#
# With a domain name pointed at this server, add automatic HTTPS (Let's Encrypt):
#   DOMAIN=coopradar.example.com docker compose -f docker-compose.prod.yml --profile https up -d --build
#   → https://coopradar.example.com
#
# See docs/DEPLOY.md for step-by-step instructions.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coopradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-coopradar}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coopradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The website + API + background worker, built from the root Dockerfile
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coopradar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coopradar}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-opus-5-5}
      FAST_MODEL: ${FAST_MODEL:-claude-haiku-5-5}
      EMBED_MODEL: ${EMBED_MODEL:-text-embedding-3-small}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Browsers only send Secure cookies over HTTPS (or to localhost). Set COOKIE_SECURE=false
      # only if you serve plain http on a real IP/domain — and prefer the https profile instead.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-8080}:8000"

  # Optional automatic HTTPS. Point your domain's DNS at this server first.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    # Compose reads every ${VAR} in this file even for profiles you don't start, so DOMAIN
    # must not be "required" here. Without DOMAIN, Caddy serves https://localhost (self-signed).
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  db_data:
  redis_data:
  caddy_data:
